<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════
         SEO - Meta de base
    ═══════════════════════════════════════════ -->
    <title>JuriBook - Trouvez un avocat, réservez en ligne</title>
    <meta name="description" content="JuriBook est la plateforme de mise en relation entre avocats et clients. Recherchez par spécialité et ville, consultez les disponibilités et réservez un rendez-vous en quelques clics." />
    <meta name="keywords" content="avocat, rendez-vous avocat, consultation juridique, droit, barreau, réservation avocat, JuriBook" />
    <meta name="author" content="JuriBook" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://juribook.fr" />

    <!-- ═══════════════════════════════════════════
         Open Graph (Facebook, LinkedIn, WhatsApp)
    ═══════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JuriBook" />
    <meta property="og:title" content="JuriBook - Trouvez un avocat, réservez en ligne" />
    <meta property="og:description" content="Recherchez un avocat par spécialité et ville, consultez ses disponibilités et réservez un rendez-vous en quelques clics. Gratuit pour les clients." />
    <meta property="og:url" content="https://juribook.fr" />
    <meta property="og:image" content="https://juribook.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JuriBook - Plateforme de rendez-vous juridiques" />
    <meta property="og:locale" content="fr_FR" />

    <!-- ═══════════════════════════════════════════
         Twitter / X Card
    ═══════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@juribook" />
    <meta name="twitter:title" content="JuriBook - Trouvez un avocat, réservez en ligne" />
    <meta name="twitter:description" content="Recherchez un avocat par spécialité et ville, consultez ses disponibilités et réservez un rendez-vous en quelques clics." />
    <meta name="twitter:image" content="https://juribook.fr/og-image.png" />
    <meta name="twitter:image:alt" content="JuriBook - Plateforme de rendez-vous juridiques" />

    <!-- ═══════════════════════════════════════════
         Données structurées JSON-LD (Google)
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "JuriBook",
      "url": "https://juribook.fr",
      "description": "Plateforme de mise en relation entre avocats et clients. Réservation de rendez-vous juridiques en ligne.",
      "applicationCategory": "LegalService",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "description": "Gratuit pour les clients"
      },
      "provider": {
        "@type": "Organization",
        "name": "JuriBook",
        "url": "https://juribook.fr"
      }
    }
    </script>

    <!-- ═══════════════════════════════════════════
         Performance - Preconnect
    ═══════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- ═══════════════════════════════════════════
         Thème couleur (barre navigateur mobile)
    ═══════════════════════════════════════════ -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="msapplication-TileColor" content="#4F46E5" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
